name: ideal-home-rocm-migration

services:
  web:
    image: ideal-home-local:web-textv43-20261022
    build:
      context: .
      dockerfile: Dockerfile.web.rocm
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AI_MODE: local
      LOCAL_TEXT_BASE_URL: http://ai-gateway:8300/text/v1
      LOCAL_TEXT_MODEL: Ours
      LOCAL_VISION_PROJECTOR: mmproj-Qwen3.8-35B-A3B-F16.gguf
      LOCAL_IMAGE_BASE_URL: http://ai-gateway:8300/image
      LOCAL_IMAGE_MODEL: Qwen-Image-2.1
      PASCAL_MCP_URL: http://pascal-mcp:3100/mcp
      QWEN_TEXT_TIMEOUT_MS: "600000"
      QWEN_IMAGE_TIMEOUT_MS: "900000"
      MODEL3D_TIMEOUT_MS: "900000"
      QWEN_FLOORPLAN_MAX_DIMENSION: "512"
      QWEN_FLOORPLAN_RULER_TOP: "0.05"
      QWEN_FLOORPLAN_RULER_BOTTOM: "0.05"
      QWEN_FLOORPLAN_RULER_LEFT: "0.15"
      QWEN_FLOORPLAN_RULER_RIGHT: "0.15"
      QWEN_FLOORPLAN_RULER_MASK: "1"
      QWEN_INTERIOR_MAX_DIMENSION: "512"
      GENERATED_IMAGE_DIR: /data/generated
      ROCR_VISIBLE_DEVICES: "0"
    volumes:
      - /srv/ideal-home/data/rocm-migration-generated:/data/generated
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "992"
      - "44"
    ports:
      - "${WEB_PORT:-3002}:3000"
    depends_on:
      ai-gateway:
        condition: service_healthy
      pascal-mcp:
        condition: service_started
    networks: [ai-private, web-ingress]

  ai-gateway:
    image: ideal-home-local:web-live3d-20261013
    restart: unless-stopped
    command: ["node", "--experimental-strip-types", "services/local-ai-gateway/server.ts"]
    environment:
      LOCAL_AI_GATEWAY_PORT: "8300"
      TEXT_UPSTREAM: http://gufo-serve:18080
      IMAGE_UPSTREAM: http://qwen-image:8200
    depends_on:
      qwen-text:
        condition: service_started
      qwen-image:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8300/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [ai-private]

  qwen-text:
    image: ideal-home-llama-rocm:7.2.1
    restart: unless-stopped
    command:
      - --model
      - /models/Qwen3.8-35B-A3B-Q6_K.gguf
      - --mmproj
      - /models/mmproj-Qwen3.8-35B-A3B-F16.gguf
      - --alias
      - Qwen3.8-35B-A3B-Distill-Q6_K
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "32768"
      - --parallel
      - "1"
      - --n-gpu-layers
      - "99"
      - --jinja
      - --reasoning-format
      - none
      - --no-reasoning-preserve
      - --image-min-tokens
      - "1024"
      - --metrics
      - --no-webui
    volumes:
      - /srv/ideal-home/models/text:/models:ro
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "992"
      - "44"
    environment:
      GGML_HIP_VISIBLE_DEVICES: "0"
      HIP_VISIBLE_DEVICES: "0"
      LD_LIBRARY_PATH: /opt/llama/lib:/opt/rocm/lib
    shm_size: 2gb
    networks: [ai-private]

  qwen-image:
    image: ideal-home-qwen-image-rocm:256-final
    restart: unless-stopped
    environment:
      QWEN_IMAGE_MODEL_PATH: /models/Qwen-Image-2.1
      QWEN_IMAGE_LORA_PATH: /models/viggle-turbo
      QWEN_IMAGE_LORA_NAME: Qwen-Image-2.1-viggle-turbo-4step-lora-r64.safetensors
      QWEN_IMAGE_SCHEDULER_PATH: /models/viggle-scheduler
      QWEN_IMAGE_MAX_DIMENSION: "512"
      QWEN_IMAGE_WARMUP_SIZES: "512x512,512x288,288x512"
      QWEN_IMAGE_VAE_TILING: "0"
      MIOPEN_FIND_MODE: "FAST"
      GENERATED_IMAGE_DIR: /data/generated
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ROCR_VISIBLE_DEVICES: "0"
    volumes:
      - /srv/ideal-home/models/qwen-image-diffusers:/models:ro
      - /srv/ideal-home/rocm-migration/server.py:/app/server.py:ro
      - /srv/ideal-home/data/rocm-migration-generated:/data/generated
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "992"
      - "44"
    ipc: host
    shm_size: 16gb
    networks: [ai-private]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 600s

  pascal-mcp:
    image: ideal-home-local:web-textv43-20261022
    restart: unless-stopped
    command: ["npm", "run", "mcp:start"]
    environment:
      NODE_ENV: production
      PASCAL_MCP_PORT: "3100"
      PASCAL_SCENE_DIR: /data/scenes
      LOCAL_TEXT_MODEL: Ours
    volumes:
      - /srv/ideal-home/data/rocm-migration-scenes:/data/scenes
    networks: [ai-private]

networks:
  ai-private:
    internal: true
  web-ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
