<?xml version="1.0"?>
<fontconfig>
  <!-- The deployment mounts the host's existing open Noto CJK fonts read-only. -->
  <dir>/usr/share/fonts/opentype/noto</dir>
  <cachedir>/tmp/dreamhouse-font-cache</cachedir>
  <alias><family>sans-serif</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>Times New Roman</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
</fontconfig>
